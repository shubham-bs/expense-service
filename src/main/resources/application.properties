spring.application.name=expense-service
spring.datasource.url=jdbc:postgresql://expense-postgres:5432/expense_db
spring.datasource.username=shubhambagate
spring.datasource.password=postgres
server.port=8085
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate

spring.kafka.bootstrap-servers=sms-kafka:29092
spring.kafka.consumer.group-id=expense-group
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer

spring.kafka.consumer.properties.spring.deserializer.key.delegate.class=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.value.default.type=com.shubham.expenseservice.dto.ParsedExpenseDto
spring.kafka.consumer.properties.spring.json.trusted.packages=com.shubham.expenseservice.dto
spring.kafka.consumer.properties.spring.json.use.type.headers=false